# Self-contained evaluation stack: `docker compose up --build` needs nothing
# installed but Docker. Runs the app in production mode against a bundled
# Postgres. Override ADMIN_API_TOKEN / CORS_ALLOWED_ORIGINS via the shell or a
# .env file; the defaults below only exist so a first run works out of the box.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: courier_platform
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier
    ports:
      - "5432:5432" # so `npm run dev` / `npm test` on the host can use this DB too
    volumes:
      - courier-db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier -d courier_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  courier-platform:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://courier:courier@db:5432/courier_platform
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  courier-db-data:
